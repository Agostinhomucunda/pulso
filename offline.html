<!doctype html>
<html lang="pt-AO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0739a8">
  <title>Sem ligação — PULSO</title>
  <link rel="icon" href="./assets/pwa-icon-192.png" type="image/png">
  <link rel="stylesheet" href="./pwa.css">
  <style>
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#f5f8ff,#e8effc);color:#13264d;font-family:'DM Sans',Arial,sans-serif}.offline-card{width:min(100%,480px);padding:clamp(24px,6vw,42px);border:1px solid #dce6f7;border-radius:24px;background:#fff;text-align:center;box-shadow:0 24px 65px #12346b18}.offline-logo{width:82px;height:82px;object-fit:contain;margin:0 auto 13px}.offline-kicker{color:#5474ad;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.offline-card h1{margin:10px 0;color:#142a56;font-size:clamp(26px,7vw,34px);line-height:1.12;letter-spacing:-1px}.offline-card p{margin:0 auto 21px;max-width:360px;color:#71809b;font-size:14px;line-height:1.65}.offline-card button{min-height:46px;padding:0 20px;border:0;border-radius:12px;background:#0a57ed;color:#fff;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 9px 20px #0a57ed2c}.offline-note{display:block;margin-top:16px;color:#8b97ad;font-size:10px;line-height:1.5}
  </style>
</head>
<body>
  <main class="offline-card">
    <img class="offline-logo" src="./assets/pulso-mark-3d-small.png" alt="PULSO">
    <span class="offline-kicker">PULSO · OPORTUNIDADES EM MOVIMENTO</span>
    <h1>Estás sem ligação à internet.</h1>
    <p>Liga o Wi-Fi ou os dados móveis para abrir o PULSO e consultar as oportunidades e a tua conta.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
    <small class="offline-note">Quando a ligação voltar, tenta novamente. A aplicação não guarda os teus dados privados para utilização offline.</small>
  </main>
</body>
</html>
